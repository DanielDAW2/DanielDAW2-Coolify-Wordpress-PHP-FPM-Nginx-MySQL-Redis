; ============================================================
; PHP runtime configuration for WordPress
;
; This file is loaded automatically by PHP-FPM via the
; conf.d directory. Values here override php.ini defaults.
;
; To apply changes: redeploy the stack or run
;   docker exec <container> kill -USR2 1
; ============================================================

; --- Memory & execution limits ---

; Maximum memory a single PHP process can use
; Must be <= WP_MEMORY_LIMIT defined in docker-compose.yml
memory_limit = 1024M

; Maximum file size for a single upload
upload_max_filesize = 64M

; Maximum size of POST data (must be >= upload_max_filesize)
post_max_size = 64M

; Maximum time (seconds) a script is allowed to run
max_execution_time = 120

; Maximum time (seconds) to parse input data (uploads, POST)
max_input_time = 120

; Maximum number of input variables (needed for large option pages)
max_input_vars = 3000

; --- OPcache — bytecode cache (critical for performance) ---

; Enable OPcache (must be 1 in production)
opcache.enable = 1

; RAM allocated to store compiled PHP bytecode (in MB)
; Increase to 512 if you have many plugins
opcache.memory_consumption = 256

; RAM for interned strings (shared between processes)
opcache.interned_strings_buffer = 16

; Maximum number of PHP files that can be cached
opcache.max_accelerated_files = 10000

; How often (seconds) to check if a cached file has changed
; Set to 0 in production if you deploy via Git (faster)
opcache.revalidate_freq = 60

; Required by some WordPress plugins that read PHP docblocks
opcache.save_comments = 1

; Free memory faster when a request ends
opcache.fast_shutdown = 1
