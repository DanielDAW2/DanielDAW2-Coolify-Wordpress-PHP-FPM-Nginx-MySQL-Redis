# ============================================================
# WordPress Stack for Coolify
# Services: Nginx + WordPress (PHP-FPM) + MySQL + Redis
#
# REQUIRED environment variables (set in Coolify UI):
#   - WORDPRESS_DB_NAME     : Database name (e.g. wordpress)
#   - WORDPRESS_DB_USER     : Database user (e.g. wordpress)
#   - WORDPRESS_DB_PASSWORD : Strong password for the DB user
#
# AUTO-GENERATED by Coolify:
#   - SERVICE_PASSWORD_MYSQL : MySQL root password (magic variable)
#
# OPTIONAL:
#   - WORDPRESS_TABLE_PREFIX : Table prefix, defaults to wp_
#
# After first deploy:
#   1. Install "Redis Object Cache" plugin by Till Krüss
#   2. Go to Settings -> Redis -> Enable Object Cache
# ============================================================

services:

  # ------------------------------------------------------------
  # NGINX — public-facing reverse proxy
  # Built from nginx/Dockerfile which copies default.conf
  # This is the only service that should have a domain assigned
  # in Coolify. All other services are internal.
  # ------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      # WordPress files shared with PHP-FPM (read-only for nginx)
      - wordpress-files:/var/www/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # WORDPRESS (PHP-FPM) — internal service, not exposed publicly
  # Built from fpm/Dockerfile which copies www.conf and wp-custom.ini
  # Communicates with Nginx via FastCGI on port 9000
  #
  # CVE-2026-109618 hardening: the container memory limit is the
  # availability boundary (per PHP advisory — do NOT use RLIMIT_AS/DATA
  # instead). A cgroup limit makes a runaway worker killable before it
  # degrades the host. The patched PHP runtime handles OOM correctly.
  # ------------------------------------------------------------
  wordpress:
    build:
      context: .
      dockerfile: fpm/Dockerfile
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=mysql:3306
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:?wordpress}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:?wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD:?}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      # Extra PHP constants injected into wp-config.php automatically
      # Note: WP_MAX_MEMORY_LIMIT is now inert — fpm/Dockerfile sets
      # php_admin_value[memory_limit] = 256M, which plugins cannot raise
      # via ini_set() (this is intentional, see the PHP advisory).
      # With the app-level limit fixed, WP_MAX_MEMORY_LIMIT can no
      # longer allocate beyond it even if a plugin tries.
      - WORDPRESS_CONFIG_EXTRA=
          if (!defined('WP_CACHE')) define('WP_CACHE', true);
          define('WP_REDIS_HOST', 'redis');
          define('WP_REDIS_PORT', 6379);
          define('WP_MEMORY_LIMIT', '512M');
          define('WP_MAX_MEMORY_LIMIT', '1024M');
    volumes:
      # Persistent WordPress files (plugins, themes, uploads)
      - wordpress-files:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ------------------------------------------------------------
  # MYSQL 8.4 — internal database service
  # Built from mysql/Dockerfile which copies wp-tuning.cnf
  # Data is persisted in the mysql-data volume
  # ------------------------------------------------------------
  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    restart: unless-stopped
    environment:
      # Root password is auto-generated by Coolify (magic variable)
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:?wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:?wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD:?}
    volumes:
      # Persistent database storage
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # REDIS 7.4 — internal object cache service
  # No custom build needed — configured via command flags
  # Used by WordPress via the Redis Object Cache plugin
  # ------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
    volumes:
      # Persistent Redis RDB snapshots
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# Named volumes managed by Docker/Coolify
volumes:
  wordpress-files:   # Shared between nginx (ro) and wordpress (rw)
  mysql-data:        # MySQL database files
  redis-data:        # Redis persistence snapshots
