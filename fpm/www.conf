; ============================================================
; PHP-FPM pool configuration for WordPress
; Tuned for a server with 6 GB RAM
;
; Key values to adjust per server size:
;   pm.max_children  = available_ram_for_php / avg_process_ram
;   Typical WordPress process uses 50-80 MB RAM
;
;   6 GB server  → max_children = 80
;   12 GB server → max_children = 160
;
; To reload without container restart:
;   docker exec <container> kill -USR2 1
;
; To verify applied config:
;   docker exec <container> php-fpm -tt 2>&1
; ============================================================

[www]
user = www-data
group = www-data

; Listen on TCP socket (required for Nginx FastCGI proxy)
listen = 9000

; Dynamic mode: spawns workers on demand, releases when idle
; Best for variable traffic patterns (recommended for WordPress)
pm = dynamic

; Maximum number of child processes allowed at once
; Formula: available_RAM_MB / avg_process_MB = 2500 / 65 ≈ 80
pm.max_children = 80

; Workers spawned at startup
pm.start_servers = 20

; Minimum idle workers kept alive to handle traffic spikes
pm.min_spare_servers = 10

; Maximum idle workers before they are killed to free RAM
pm.max_spare_servers = 30

; Recycle workers after this many requests to prevent memory leaks
; caused by poorly written plugins
pm.max_requests = 500

; Kill idle workers after this timeout to recover RAM
pm.process_idle_timeout = 10s

; Log requests taking longer than 5s to stderr (visible in Coolify logs)
slowlog = /proc/1/fd/2
request_slowlog_timeout = 5s

; Pass essential environment variables to worker processes
; Required for WP-CLI and cron jobs to work correctly
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp