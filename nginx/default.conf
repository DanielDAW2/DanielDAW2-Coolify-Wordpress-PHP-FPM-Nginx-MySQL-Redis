# ============================================================
# Nginx virtual host configuration for WordPress
#
# This file is mounted read-only into the nginx container.
# PHP requests are proxied to the wordpress service via
# FastCGI on port 9000 (internal Docker network).
#
# To apply changes: run "nginx -s reload" inside the container
# or redeploy the stack from Coolify.
# ============================================================

server {
    listen 80;
    root /var/www/html;
    index index.php;

    # Max upload size — must match php/wp-custom.ini values
    client_max_body_size 64M;

    # Enable gzip compression for common text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Standard WordPress permalink routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP files to WordPress (PHP-FPM) container
    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Cache static assets aggressively in the browser
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # Suppress noisy 404 logs for common bot requests
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Block access to hidden files (e.g. .htaccess, .git, .env)
    location ~ /\. { deny all; }
}